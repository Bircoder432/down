
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""

          - os: macos-26-intel
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-26
            target: aarch64-apple-darwin
            ext: ""

          - os: windows-2025
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          BIN: YOUR_BINARY_NAME
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/$BIN" "dist/$BIN"
          tar -czf "$BIN-$TARGET.tar.gz" -C dist "$BIN"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BIN: YOUR_BINARY_NAME
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/$env:TARGET/release/$env:BIN.exe" dist/
          Compress-Archive -Path "dist/$env:BIN.exe" `
            -DestinationPath "$env:BIN-$env:TARGET.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
